[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vkpostscheduler"
description = "PyQt5 desktop app that queues delayed wall posts to VK communities"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "keyring>=24.0",
    "Pillow>=8.0",
    "PyQt5>=5.15",
    "requests>=2.28",
    "vk-api>=11.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "types-requests>=2.31",
]

[project.gui-scripts]
vkpostscheduler = "vkpostscheduler.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vkpostscheduler.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pyflakes, isort, bugbear; style rules stay off on purpose
select = ["F", "I", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
# cheap checks that catch real bugs
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# the codebase is fully annotated; keep it that way
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["vk_api.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tests stay checked, minus per-function annotations
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
